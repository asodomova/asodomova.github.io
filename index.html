<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Adéla Sodomová</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="styles.css" />

<style>
  :root {
    --first-size:    clamp(32px, 4.5vw, 62px);
    --last-size:     clamp(40px, 5.8vw, 80px);
    --tagline-size:  clamp(13px, 1.3vw, 18px);
    --painting-size: clamp(300px, 31.2vw, 432px);
  }

  .home {
    display: flex;
    flex-direction: row;
    align-items: flex-end;
    justify-content: space-between;
    gap: 60px;
    width: 100%;
    padding-top: 220px;
    padding-bottom: 80px;
  }

  .home-name {
    flex: 1 1 auto;
    min-width: 0;
  }

  .home-name .first {
    font-family: 'Crimson Pro', 'Crimson Text', serif;
    font-weight: 400;
    font-size: var(--first-size);
    line-height: 1;
    display: block;
    letter-spacing: -0.01em;
  }

  .home-name .last {
    font-family: 'PP NeueBit', monospace;
    font-weight: 700;
    font-size: var(--last-size);
    line-height: 0.8;
    display: block;
    margin-top: 2px;
    letter-spacing: 0.0em;
  }

  .home-name .tagline {
    margin-top: 6px;
    font-family: 'Inter', sans-serif;
    font-size: var(--tagline-size);
    color: var(--ink);
  }

  .home-painting-wrap {
    flex: 0 0 auto;
  }

  .home-painting {
    width: var(--painting-size);
    height: var(--painting-size);
    background: url('assets/painting.jpg') center / cover no-repeat;
  }

  .painting-credit {
    margin-top: 10px;
    text-align: right;
    font-family: 'Inter', sans-serif;
    font-size: clamp(13px, 1vw, 16px);
    color: var(--ink);
  }

  .painting-credit a {
    color: inherit;
    border-bottom: 1px solid currentColor;
    transition: color 0.2s ease;
  }
  .painting-credit a:hover { color: var(--blue); }

  @media (max-width: 700px) {
    .home {
      flex-direction: column;
      align-items: flex-start;
      padding-top: 16px;
      gap: 32px;
    }
    .home-painting-wrap { align-self: flex-end; margin-top: 170px; }
  }
</style>
</head>
<body data-page="home" data-footer="right">

  <main class="home">
    <div class="home-name">
      <span class="first">Adéla</span>
      <span class="last">Sodomová</span>
      <div class="tagline">Transdisciplinary social science research</div>
    </div>

    <div class="home-painting-wrap">
      <div class="home-painting" role="img" aria-label="Painting by Nicolás Ortega"></div>
      <div class="painting-credit">painting by <a href="https://nicolasortega.cargo.site/" target="_blank" rel="noopener">Nicolás Ortega</a></div>
    </div>
  </main>

  <script src="menu.js"></script>
</body>
</html>
