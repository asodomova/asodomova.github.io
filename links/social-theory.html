<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Social theory terms curated · Adéla Sodoma</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../styles.css" />
<base href="../" />
<style>

  /* ── Page header ── */
  .page-header {
    margin-top: 70px;
    font-family: 'Roboto Mono', monospace;
    letter-spacing: 0.04em;
  }
  .page-header h1 {
    font-family: inherit;
    font-size: 22px;
    font-weight: 400;
    line-height: 1;
    margin: 0;
  }
  .page-header p {
    margin: 10px 0 0;
    font-family: inherit;
    font-size: 13px;
    color: rgba(0,0,0,0.5);
  }

  /* ── Entry list ── */
  .entries {
    margin-top: 48px;
    max-width: 820px;
  }

  .entry {
    border-top: 1px solid var(--rule);
    padding: 16px 0;
  }
  .entry:last-child { border-bottom: 1px solid var(--rule); }

  .entry-name {
    font-family: 'Roboto Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .entry-notes {
    margin: 10px 0 0;
    padding: 0;
    list-style: none;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: rgba(0,0,0,0.55);
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .entry-notes li::before {
    content: '// ';
    font-family: 'Roboto Mono', monospace;
    font-size: 11px;
  }

</style>
</head>
<body data-page="where-link">

  <div class="page-header">

    </div>
